name: Monitor Repos

# Render README.md from the data the Content Studio scheduler publishes.
#
# This workflow used to own the whole pipeline: fetch the public repos, probe
# every deployment with Playwright, write the badges, append data/report.json,
# then render. All of that moved into the studio scheduler's "repos" job on
# 2026-08-30 — it already did exactly those steps for the private projects, and
# running them in two places meant two writers fighting over data/. The
# scheduler is now the sole writer of everything under data/ except the files
# rendered here, and this is left with the one job it can still do best: turn
# the published report into the README.
#
# So it runs when that data lands, and on nothing else. The scheduler pushes
# with a fine-grained PAT rather than the Actions GITHUB_TOKEN, so its commits
# do trigger this; its coverage pushes and this job's own commits touch neither
# watched path, so neither retriggers it.
#
# The two paths are exactly what generate-readme reads. report.json moves on
# every publish (each one appends an entry), so the filter cannot miss a real
# refresh; projects.json is watched because the README's table is built from it
# and a hand edit there would otherwise never be rendered.
#
# There is deliberately no cron. The render is a pure function of those two
# files, so a timed run on unmoved data rewrites the same bytes and commits
# nothing — and the only thing it could recover, a render that failed after a
# successful publish, is retried by the next daily publish anyway.
on:
  push:
    branches: [main]
    paths:
      - data/report.json
      - data/projects.json
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      # No .env step: generate-readme reads data/report.json, data/projects.json
      # and templates/README.md.tpl straight off the checkout and needs no
      # secrets. The step this replaced echoed the whole ENV_FILE secret into
      # the build log.
      - name: Generate new readme
        run: bun run generate-readme
      - name: Commit and push changes
        run: |
          git config --local user.email "$USER_EMAIL"
          git config --local user.name "$USER_NAME"
          # README.md and the chart SVGs beside it are the only files this
          # workflow writes, so `data` can only ever stage those. `.github` is
          # deliberately NOT staged any more: update-cron rewrote
          # .github/workflows/last-update.json on every run and PUSH_TOKEN has
          # no `workflow` scope, so every push from 2026-08-25 on was rejected
          # and the README sat frozen for five days.
          git add README.md data
          git diff --quiet && git diff --staged --quiet || git commit -m "[bot] Update readme"
        env:
          USER_EMAIL: ${{ vars.USER_EMAIL }}
          USER_NAME: ${{ vars.USER_NAME }}
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main
